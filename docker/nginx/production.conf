server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /app/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # No file upload limit for API
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/javascript;

    # All /api/ requests → PHP-FPM directly (no try_files on nginx filesystem)
    # SCRIPT_FILENAME=/app/public/index.php points to PHP-FPM container filesystem
    # REQUEST_URI preserves the original path so Laravel routes correctly
    location /api/ {
        fastcgi_pass yalihanai-app-v2:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Server;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout  60s;
        fastcgi_read_timeout  60s;
    }

    # Deny access to sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Static assets — long cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny storage/ access
    location /storage/ {
        internal;
    }
}
