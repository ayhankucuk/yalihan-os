server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /app/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # No file upload limit for API
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/javascript;

    # All routes — non-file/directory fall through to /index.php (Laravel front-controller)
    # For /api/v1/... requests: try_files checks /app/public/api/v1/... → not found → /index.php
    # The ~ \.php$ block below then routes /index.php to PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to sensitive paths
    location ~ /\.(?!well-known) {
        deny all;
    }

    # FastCGI — catches /index.php (Laravel front-controller) and *.php routes
    # When nginx rewrites /api/v1/... to /index.php via try_files fallback,
    # REQUEST_URI is preserved as the original path → Laravel routes correctly
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass yalihanai-app-v2:9000;

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Server;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout  60s;
        fastcgi_read_timeout  60s;
    }

    # Static assets — long cache
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Deny access to storage/ directly
    location /storage/ {
        internal;
    }
}
