[www]
; ✅ P2: PHP-FPM Configuration for Docker

; User/Group
user = appuser
group = appuser

; Listen settings
listen = 0.0.0.0:9000
listen.backlog = 65535

; Process management
pm = dynamic
pm.max_children = 20
pm.start_servers = 5
pm.min_spare_servers = 2
pm.max_spare_servers = 10
pm.max_requests = 500

; Timeouts
request_terminate_timeout = 60
request_slowlog_timeout = 10s

; Logging — /var/log/php is root-only; use /app/storage/logs (owned by appuser)
; access.log and slowlog written by FPM workers must go to persistent storage
access.log = /app/storage/logs/php-fpm-access.log
access.format = "%R - %u %t \"%m %r%Q%q\" %s %f %{mili}d %{kilobytes}M %C%%"
slowlog = /app/storage/logs/php-fpm-slow.log

; Environment
clear_env = no
catch_workers_output = yes
decorate_workers_output = yes

; Security
security.limit_extensions = .php

; Performance — opcache.preload moved to php.ini if preload.php is implemented
; opcache.preload requires /app/config/preload.php to exist
