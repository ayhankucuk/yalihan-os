[PHP]
; ✅ P2: PHP Configuration for Docker Environment

; Basic settings
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
post_max_size = 100M
upload_max_filesize = 100M

; Error handling
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /app/storage/logs/php-error.log

; Production optimizations
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

; Date/Time
date.timezone = "UTC"

; Session
session.save_handler = redis
session.save_path = "tcp://redis:6379"
session.gc_maxlifetime = 86400

; Extensions loaded via docker-php-ext-install / pecl in Dockerfile:
; - pdo_mysql, bcmath, fileinfo, xml, gd, pcntl, zip  (docker-php-ext-install)
; - redis                                            (pecl install + enable)
; - intl                                             (docker-php-ext-install)
; DO NOT add extension= lines here — causes double-load warnings.
