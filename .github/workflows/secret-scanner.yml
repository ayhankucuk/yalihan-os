name: Secret Scanner

on:
  push:
    branches: [main, integration/**]
  pull_request:
    branches: [main, integration/**]

# ============================================================
# ARCHITECTURE NOTE
# All token fingerprint detection policy lives in ONE place:
#   scripts/tools/secret-scan.sh
# This workflow is a thin delegator ONLY.
# No secret patterns are defined in this file.
# SSOT: scripts/tools/secret-scan.sh
# ============================================================

jobs:
  secret-scan:
    name: Staged Diff Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Step 1: Scan staged diff via SSOT scanner ──
      - name: Scan staged diff (SSOT scanner)
        id: staged-scan
        run: |
          echo "━━━ YALIHAN OS Secret Scan (CI — Staged Diff) ━━━"
          echo "SSOT scanner: scripts/tools/secret-scan.sh"
          echo "Branch: ${{ github.ref }}"
          echo ""

          # Delegate entirely to canonical scanner
          bash scripts/tools/secret-scan.sh --staged
          exit $?

      # ── Step 2: Push backstop — delegated to SSOT scanner ──
      - name: Push backstop scan (SSOT scanner)
        if: github.event_name == 'push'
        run: |
          echo ""
          echo "━━━ YALIHAN OS Secret Scan (CI — Push Backstop) ━━━"
          echo "SSOT scanner: scripts/tools/secret-scan.sh"
          echo ""

          # Determine commit range for this push
          RANGE="${{ github.event.before }}..${{ github.sha }}"
          if [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            RANGE="${{ github.sha }}"
          fi

          # Delegate push-diff scan to canonical scanner
          # Scanner reads git diff for the given range
          bash scripts/tools/secret-scan.sh --ci "$RANGE"
          _result=$?

          if [[ $_result -ne 0 ]]; then
            echo ""
            echo "━━━ SECRET DETECTED IN COMMITTED DIFF ━━━"
            echo "Pre-commit hook was likely bypassed (--no-verify)."
            echo "Action: Revoke token, remove from file, force-push cleaned commit."
            echo "Review: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ".project-brain/REMEDIATION_BACKLOG.md (BACKLOG-1)"
          fi

          exit $_result
